
[theme_info]
name        = SukiBoo2.0
description = Dark color scheme inspired by my kitty.
version     = 2.0
author      = Anton Dereventsov

# Custom colors ===============================================================

[named_colors]
clr_white   = #dddddd
clr_gray    = #666666
clr_dark    = #222222
clr_black   = #111111

# sbn_muted colorscheme
clr_blue    = #66aadd
clr_orange  = #ddaa66
clr_aqua    = #66ddaa
clr_pink    = #dd66aa
clr_purple  = #aa66dd
clr_green   = #aadd66

# Editor styles ===============================================================

[named_styles]
# format: color;backgroundcolor;bold;italic;
default     = clr_white;clr_black;false;false;
error       = clr_purple;clr_gray;false;true;

selection               = clr_white;clr_gray;false;true;
current_line            = clr_white;clr_dark;true;false;
margin_line_number      = clr_gray;clr_dark;
margin_folding          = clr_gray;clr_dark;
fold_symbol_highlight   = clr_black;
indent_guide            = clr_gray;clr_black;
call_tips               = clr_gray;clr_black;false;false;
white_space             = clr_gray;clr_black;true;false;
caret                   = clr_white;clr_white;false;
marker_line             = clr_white;clr_white;
marker_search           = clr_white;clr_white;
marker_mark             = clr_white;clr_white;
brace_good              = clr_white;clr_gray;true;false;
brace_bad               = clr_pink;clr_dark;true;false;

# Programming languages =======================================================

comment                     = clr_aqua;clr_black;false;true;
comment_doc                 = clr_aqua;
comment_line                = clr_green;clr_black;false;true;
comment_line_doc            = comment_doc;
comment_doc_keyword         = comment_doc,bold;
comment_doc_keyword_error   = comment_doc,italic;

number      = clr_pink;
number_1    = number;
number_2    = number;

type        = clr_orange;clr_black;true;false;
class       = type;
function    = clr_orange;clr_black;true;false;
parameter   = function;

keyword     = clr_pink;clr_black;false;false;
keyword_1   = keyword;
keyword_2   = keyword;
keyword_3   = keyword;
keyword_4   = keyword;

identifier      = default;
identifier_1    = identifier;
identifier_2    = identifier;
identifier_3    = identifier;
identifier_4    = identifier;

string      = clr_blue;
string_1    = string;
string_2    = clr_purple;clr_black;false;true;
string_eol  = clr_white;
character   = string_1;
backticks   = string_2;
here_doc    = string_2;

label           = default,bold;
preprocessor    = clr_white;
regex           = number;
operator        = clr_white;
decorator       = clr_blue;clr_black;bold;
other           = clr_orange;

# Markup-type languages =======================================================

tag                 = type;
tag_unknown         = tag,bold;
tag_end             = tag,bold;
attribute           = keyword;
attribute_unknown   = attribute,bold;
value               = string;
entity              = default;

# Diff ========================================================================

line_added      = clr_aqua;clr_black;false;false;
line_removed    = clr_pink;clr_black;false;false;
line_changed    = clr_blue;clr_black;false;false;

